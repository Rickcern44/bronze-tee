name: Playtests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'shaders/**'
      - 'scenes/**'
      - 'tests/**'
      - 'dotnet/**'
      - 'assets/**'
      - 'project.godot'
      - '*.csproj'
      - 'tools/playtest.sh'
      - '.github/workflows/playtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      # Same Godot 4.7.2 mono install, cache key and checksum as macos.yml.
      # Export templates are not needed here, so they are not cached.
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-ci
          key: godot-4.7.2-mono-linux-playtest-v1
      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_mono_linux_x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          echo '129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  '"$RUNNER_TEMP/godot.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/godot-ci"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot-ci"
      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          godot_bin=$(find "$HOME/godot-ci" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)
          test -n "$godot_bin"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$godot_bin" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build C# and import assets
        shell: bash
        run: |
          set -euo pipefail
          dotnet build BronzeTee.Godot.csproj -warnaserror
          godot --headless --path . --import
      - name: Run playtest scenarios
        shell: bash
        run: |
          set -u -o pipefail
          shopt -s nullglob
          scenarios=(tests/playtest/*_playtest.gd)
          if [ "${#scenarios[@]}" -eq 0 ]; then
            echo 'No playtest scenarios found in tests/playtest/.' >&2
            exit 1
          fi
          failed=()
          for f in "${scenarios[@]}"; do
            slug=$(basename "$f" _playtest.gd)
            echo "::group::playtest $slug"
            if ! ./tools/playtest.sh "$slug"; then
              failed+=("$slug")
              echo "::error::playtest $slug failed"
            fi
            echo '::endgroup::'
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "Failed playtests: ${failed[*]}" >&2
            exit 1
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-output
          path: playtest-output/
          if-no-files-found: warn
          retention-days: 14
