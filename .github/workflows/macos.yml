name: Mac test build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-ci
            ~/Library/Application Support/Godot/export_templates/4.7.2.stable
          key: godot-4.7.2-mono-macos-v1
      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_mono_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          echo '8af3977b60d2c59802f7c8ff1914b3ca02a5e294f7381fc1104ee777e33cbbd8  '"$RUNNER_TEMP/godot.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/godot-ci"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot-ci"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_mono_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo '92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d  '"$RUNNER_TEMP/templates.tpz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/godot-templates" "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          cp -R "$RUNNER_TEMP/godot-templates/templates/." "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"
      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          godot_bin=$(find "$HOME/godot-ci" -type f -path '*/Contents/MacOS/Godot' -print -quit)
          test -n "$godot_bin"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$godot_bin" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Restore test dependencies
        run: dotnet restore dotnet/BronzeTee.Physics.Tests/BronzeTee.Physics.Tests.csproj
      - name: Run project checks
        run: ./tools/check.sh
      - name: Export Mac app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release macOS build/Bronze-Tee-macOS.zip
          test -s build/Bronze-Tee-macOS.zip
          unzip -l build/Bronze-Tee-macOS.zip | grep -q 'Bronze Tee.app/Contents/MacOS/'
      - uses: actions/upload-artifact@v4
        with:
          name: Bronze-Tee-macOS
          path: build/Bronze-Tee-macOS.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Bronze-Tee-macOS
          path: dist
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag="test-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" dist/Bronze-Tee-macOS.zip \
            --target "$COMMIT" --prerelease --title "Mac test build $RUN_ID" \
            --notes "Test build for commit $COMMIT. This Apple silicon app is ad-hoc signed and is not notarized."
