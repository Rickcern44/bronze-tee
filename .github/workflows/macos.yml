name: Mac test build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push to main is a release: the release job tags and publishes it.
# Pushes to main share one group and are never cancelled mid-run, so releases
# are serialized and each run computes its version after the previous tag
# exists. (GitHub keeps at most one waiting run; if several merges queue up,
# the newest one releases and its notes cover all of them.) PR and manual runs
# are per-ref and the superseded ones are cancelled.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-main' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      semver: ${{ steps.version.outputs.SemVer }}
      full-semver: ${{ steps.version.outputs.FullSemVer }}
      display: ${{ steps.version.outputs.DisplayVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          # GitVersion needs the full history and tags.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install course import dependencies
        run: python -m pip install -r tools/course_import/requirements.txt
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-ci
            ~/.local/share/godot/export_templates/4.7.2.stable.mono
          key: godot-4.7.2-mono-linux-v2
      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_mono_linux_x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          echo '129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  '"$RUNNER_TEMP/godot.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/godot-ci"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot-ci"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_mono_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo '92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d  '"$RUNNER_TEMP/templates.tpz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/godot-templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          cp -R "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/"
      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          godot_bin=$(find "$HOME/godot-ci" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)
          test -n "$godot_bin"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$godot_bin" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Restore test dependencies
        run: dotnet restore dotnet/BronzeTee.Physics.Tests/BronzeTee.Physics.Tests.csproj
      - name: Run project checks
        run: ./tools/check.sh
      - name: Stamp version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tools/version.sh
          tools/version.sh --stamp
      - name: Export Mac app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release macOS build/Bronze-Tee-macOS.zip 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -Eq '(^ERROR:|SCRIPT ERROR|Unhandled exception)' "$RUNNER_TEMP/export.log"; then
            echo 'Godot reported an export error.' >&2
            exit 1
          fi
          test -s build/Bronze-Tee-macOS.zip
          unzip -l build/Bronze-Tee-macOS.zip > "$RUNNER_TEMP/archive-list.txt"
          grep -q 'Bronze Tee.app/Contents/MacOS/' "$RUNNER_TEMP/archive-list.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Bronze-Tee-${{ steps.version.outputs.SemVer }}-unsigned
          path: build/Bronze-Tee-macOS.zip
          if-no-files-found: error
          retention-days: 14

  sign-and-test:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Bronze-Tee-${{ needs.build.outputs.semver }}-unsigned
          path: dist
      - name: Sign and test the Mac app
        shell: bash
        run: |
          set -euo pipefail
          unzip -q dist/Bronze-Tee-macOS.zip -d "$RUNNER_TEMP/game"
          app="$RUNNER_TEMP/game/Bronze Tee.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/Bronze Tee" --headless --quit-after 5 > "$RUNNER_TEMP/game.log" 2>&1
          if grep -Eq '(^ERROR:|SCRIPT ERROR|Unhandled exception)' "$RUNNER_TEMP/game.log"; then
            head -80 "$RUNNER_TEMP/game.log"
            echo 'The exported game reported an error.' >&2
            exit 1
          fi
          rm dist/Bronze-Tee-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/Bronze-Tee-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bronze-Tee-${{ needs.build.outputs.semver }}-macOS
          path: dist/Bronze-Tee-macOS.zip
          if-no-files-found: error
          retention-days: 14

  # Tags and publishes vX.Y.Z for every push to main. A tag pushed with
  # GITHUB_TOKEN does not trigger other workflows, so tagging and publishing
  # happen here, in one job. Only this job has contents: write.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, sign-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Check the version and create the local tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SEMVER: ${{ needs.build.outputs.semver }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SEMVER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Computed version '$SEMVER' is not a plain X.Y.Z; refusing to release." >&2
            exit 1
          fi
          tag="v$SEMVER"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # Re-running a failed release job is fine if the tag is ours.
            if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$SHA" ]; then
              echo "Tag $tag already exists on another commit; refusing to move or reuse it." >&2
              exit 1
            fi
            echo "Tag $tag already points at $SHA (re-run)."
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          # Local only for now, so git-cliff can render notes for the new tag.
          # It is pushed in the last step, right before the release is created.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "$tag" "$SHA"
          fi
      - name: Install git-cliff 2.14.2
        shell: bash
        run: |
          set -euo pipefail
          f=git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          curl -fL --retry 3 "https://github.com/orhun/git-cliff/releases/download/v2.14.2/$f" -o "$RUNNER_TEMP/$f"
          echo "24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/git-cliff-2.14.2/git-cliff" "$RUNNER_TEMP/bin/git-cliff"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          git cliff --version
          # Everything between the previous release tag and the new one.
          git cliff --current --strip all -o "$RUNNER_TEMP/notes.md"
          printf '\nThis Apple silicon app is ad-hoc signed and is not notarized.\n' >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: Bronze-Tee-${{ needs.build.outputs.semver }}-macOS
          path: dist
      - name: Tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SEMVER: ${{ needs.build.outputs.semver }}
        run: |
          set -euo pipefail
          tag="v$SEMVER"
          # Pushing a tag that already points at the same commit is a no-op;
          # a tag that exists elsewhere is rejected (no force).
          git push origin "refs/tags/$tag"
          # The asset keeps its fixed name; tools/utils/update-macos.sh looks it up.
          gh release create "$tag" dist/Bronze-Tee-macOS.zip \
            --verify-tag --latest --title "Bronze Tee $tag" \
            --notes-file "$RUNNER_TEMP/notes.md"
