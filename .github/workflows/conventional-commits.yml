name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the PR head so the commits under review are local.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: PR title (strict; squash merges use it)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./tools/check-commit-msg.sh --strict -m "$TITLE"
      - name: PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            msg="$(git log -1 --format=%B "$sha")"
            if ! ./tools/check-commit-msg.sh -m "$msg"; then
              echo "::error::commit $sha is not a Conventional Commit: $(git log -1 --format=%s "$sha")"
              status=1
            fi
          done
          exit "$status"
