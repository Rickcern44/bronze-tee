# GitVersion 6.x configuration for Bronze Tee.
#
# The version comes from git tags only; no file in the repo holds it.
#   - Release tags are annotated `vX.Y.Z` tags on main. CI creates one for
#     every push (squash merge) to main; implementers never tag by hand.
#   - Untagged commits on main compute the plain next version `X.Y.Z` (no
#     pre-release label): the highest increment found since the last release
#     tag, applied to that tag. A tagged commit computes exactly its tag.
#   - Branch builds keep a branch label (`X.Y.Z-<branch>.N`), so they can
#     never collide with a release.
#   - Other tags (`test-*`, `mac-test-*`) do not match the tag prefix and are
#     ignored.
#
# Run: dotnet tool restore && dotnet tool run dotnet-gitversion
# See README.md "Versioning and releases".

workflow: GitHubFlow/v1
tag-prefix: '[vV]'
semantic-version-format: Strict
commit-message-incrementing: Enabled

# Conventional Commits drive the increment since the last release tag.
# GitVersion takes the highest increment found in the commits since that tag.
#
# Pre-1.0 rules (0.y.z, current):
#   breaking change (`type!:` / `type(scope)!:` / `BREAKING CHANGE:` footer) -> minor
#   every other conventional type (feat, fix, perf, ...)                     -> patch
#   non-conventional subjects (legacy `RCE-nnn: ...`, `Add ...`, merges)     -> no
#     match, so the branch default increment (patch) applies
#
# The major regex never matches before 1.0.0, so nothing can bump the major by
# accident. Reaching 1.0.0 needs an explicit decision by the project owner:
# tag v1.0.0 by hand, then swap these three regexes for the post-1.0 block.
major-version-bump-message: '(?!)'
minor-version-bump-message: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!:|(?m)^BREAKING[ -]CHANGE:|\+semver:\s?(breaking|major|feature|minor)'
patch-version-bump-message: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?:|\+semver:\s?(fix|patch)'
no-bump-message: '\+semver:\s?(none|skip)'

# Post-1.0 rules (enable only after the owner decides to ship 1.0.0):
# major-version-bump-message: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!:|(?m)^BREAKING[ -]CHANGE:|\+semver:\s?(breaking|major)'
# minor-version-bump-message: '^feat(\([a-z0-9._/-]+\))?:|\+semver:\s?(feature|minor)'
# patch-version-bump-message: '^(build|chore|ci|docs|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?:|\+semver:\s?(fix|patch)'

branches:
  main:
    regex: ^main$
    # No label, and ContinuousDeployment (ContinuousDelivery and ManualDeployment
    # both append a build counter): main computes the plain next version,
    # 0.1.1, 0.1.2, ...
    mode: ContinuousDeployment
    label: ''
    increment: Patch
    is-main-branch: true
  feature:
    # Conventional branch names (feat/..., fix/..., ci/...) plus feature/...
    regex: ^(feat|features?|fix|perf|refactor|docs|test|build|ci|chore|style|revert)[/-](?<BranchName>.+)
    mode: ManualDeployment
    label: '{BranchName}'
    increment: Inherit
    source-branches: [main]
