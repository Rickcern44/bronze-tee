# git-cliff configuration for Bronze Tee (pinned: git-cliff 2.14.2).
#
# Output follows Keep a Changelog 1.1.0. Conventional Commits are grouped by
# type; older non-conventional subjects ("RCE-nnn: ...", "Add ...", "Fix ...")
# are grouped by a verb heuristic. Merge commits are skipped.
#
# There is no committed changelog: CI renders the notes of every release and
# attaches them to the GitHub Release.
#
#   git cliff --unreleased --strip all               # preview what the next release holds
#   git cliff --unreleased --tag vX.Y.Z --strip all  # ... titled as the next version
#   git cliff --current --strip all                  # notes for the tag on HEAD (CI)
#   git cliff --latest --strip all                   # notes for the newest tag

[changelog]
header = """# Changelog

All notable changes to this project are documented here, generated by
[git-cliff](https://git-cliff.org) from `cliff.toml`. Versions come from git
tags (see `GitVersion.yml`).

## [Unreleased]
"""
# The header is dropped by `--strip all` (as used for GitHub Release notes). It
# opens "## [Unreleased]" so a full local `git cliff` run reads as a changelog:
# unreleased commits render only their groups, tagged releases get a heading.
# Blank lines are generous here; the postprocessor collapses runs of them.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}

{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}
{% endfor %}
"""
# Link references; trimmed because git-cliff adds the final newline itself.
footer = """{% filter trim %}{% set repo = "https://github.com/Rickcern44/bronze-tee" -%}
{% for release in releases -%}
{% if release.version -%}
{% if loop.first -%}
[Unreleased]: {{ repo }}/compare/{{ release.version }}...HEAD
{% endif -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ repo }}/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ repo }}/releases/tag/{{ release.version }}
{% endif -%}
{% elif release.previous.version -%}
[Unreleased]: {{ repo }}/compare/{{ release.previous.version }}...HEAD
{% else -%}
[Unreleased]: {{ repo }}/commits/main
{% endif -%}
{% endfor %}{% endfilter %}"""
# Whitespace is managed in the templates so sections stay one blank line apart.
trim = false
postprocessors = [
  # Runs on each rendered part: at most one blank line in a row.
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Only vX.Y.Z tags (created by CI on every merge to main) are releases; test-* and mac-test-* are ignored.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
  # Legacy "RCE-169: Subject" -> "Subject (RCE-169)" so the verb heuristic sees the subject.
  { pattern = '^(RCE-[0-9]+):\s*([^\n]*)', replace = "${2} (${1})" },
  # Linear keys anywhere -> links.
  { pattern = '\b(RCE-[0-9]+)\b', replace = "[${1}](https://linear.app/rcerny/issue/${1})" },
  # GitHub PR refs "(#7)" -> links.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/Rickcern44/bronze-tee/pull/${1}))" },
]

# First match wins. The HTML comments fix the section order and are stripped.
commit_parsers = [
  { message = '^Merge ', skip = true },
  { message = '^chore\(release\)', skip = true },
  { body = '(?i)security', group = "<!-- 5 -->Security" },
  # Conventional Commits.
  { message = '^feat', group = "<!-- 0 -->Added" },
  { message = '^fix', group = "<!-- 4 -->Fixed" },
  { message = '^(perf|refactor|style)', group = "<!-- 1 -->Changed" },
  { message = '^revert', group = "<!-- 1 -->Changed" },
  { message = '^docs', group = "<!-- 6 -->Documentation" },
  { message = '^(build|ci|chore|test)', group = "<!-- 7 -->Maintenance" },
  # Legacy, non-conventional subjects.
  { message = '^(Add|Import|Build|Include|Create|Introduce)\b', group = "<!-- 0 -->Added" },
  { message = '^(Remove|Delete|Drop)\b', group = "<!-- 3 -->Removed" },
  { message = '^Fix', group = "<!-- 4 -->Fixed" },
  { message = '.*', group = "<!-- 1 -->Changed" },
]
